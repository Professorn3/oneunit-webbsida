server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Brevo API Proxy to bypass CORS
    location /api/brevo/ {
        proxy_pass https://api.brevo.com/v3/;
        proxy_ssl_server_name on;
    }

    # PocketBase API
    location /api/ {
        proxy_pass http://192.168.1.157:8095/api/;
    }

    # PocketBase Admin UI
    location /_/ {
        proxy_pass http://192.168.1.157:8095/_/;
    }

    # React Router – skicka alla routes till index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
