services:
  oneunit-webbsida:
    image: nginx:alpine
    container_name: oneunit-webbsida
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - /mnt/user/appdata/oneunit-webbsida/dist:/usr/share/nginx/html:ro
      - /mnt/user/appdata/oneunit-webbsida/nginx.conf:/etc/nginx/conf.d/default.conf:ro
